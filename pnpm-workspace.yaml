packages:
  - apps/*
  - packages/*
  - services/*

# Native/binary builds are opt-in; anything not listed is denied.
allowBuilds:
  esbuild: true
  # Cloudflare's local Workers runtime (wrangler dev/deploy for the gateway and the web Worker).
  workerd: true

# One version per shared dependency across apps, packages and services.
catalog:
  typescript: ~6.0.3
  "@types/node": ^24
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": ^19.1.1
  "@types/react-dom": ^19.1.1
  next: 16.4.2
  "@tanstack/react-query": 5.104.3
  zod: 4.6.7
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  ohttp-ts: 0.6.1
  hpke: 1.1.7
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@scure/base": 2.4.0
  "@scure/bip32": 2.4.0
  "@nktkas/hyperliquid": 0.33.3
  viem: 2.57.4
  lucide-react: 1.52.0
  "@number-flow/react": 0.6.2
  motion: 14.0.0
  "@web3icons/core": 4.0.58

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.9"
  - "@turbo/darwin-arm64@2.11.9"
  - "@turbo/linux-64@2.11.9"
  - "@turbo/linux-arm64@2.11.9"
  - "@turbo/windows-64@2.11.9"
  - "@turbo/windows-arm64@2.11.9"
  - turbo@2.11.9
  - "@cloudflare/workers-types@5.20261022.1"
